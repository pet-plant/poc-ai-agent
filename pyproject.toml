[project]
name = "plant-poc"
version = "0.1.0"
description = "Post-VLM Pipeline POC: Event Engine -> Knowledge RAG -> Care Advisor -> Companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langchain-postgres>=0.0.18",
]

[project.scripts]
plant-poc = "plant_poc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plant_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
